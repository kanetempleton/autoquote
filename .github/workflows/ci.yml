name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true   # caches gems automatically

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install gems
        run: bundle install

      - name: Run API tests (RSpec)
        run: bundle exec rspec --format documentation

      - name: Run UI tests (Cucumber)
        run: bundle exec cucumber --format pretty

      - name: Upload Cucumber reports (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-artifacts
          path: |
            tmp/
            features/reports/
          if-no-files-found: ignore